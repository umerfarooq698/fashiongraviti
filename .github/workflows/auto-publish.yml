name: Auto Publish Editorial Articles

on:
  schedule:
    # Run every 10 minutes continuously
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: auto-publish-group
  cancel-in-progress: false

jobs:
  publish-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Generate and Insert Article from Google Sheet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/auto-publish.js

      - name: Verify Build
        run: npm run build

      - name: Commit and Push to Main Branch
        run: |
          git config user.name "Fashion Graviti Bot"
          git config user.email "bot@fashiongraviti.com"
          git add src/data/initialArticles.ts scripts/published-keywords.json
          if git diff --staged --quiet; then
            echo "No changes to commit (no new article was generated)."
          else
            git commit -m "Auto-publish new editorial article from content schedule"
            git push origin main
          fi
