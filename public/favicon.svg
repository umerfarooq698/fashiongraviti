<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favGoldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2D1" />
      <stop offset="25%" stopColor="#E2C17D" />
      <stop offset="60%" stopColor="#C59D54" />
      <stop offset="100%" stopColor="#8C6627" />
    </linearGradient>
    <linearGradient id="favGoldShimmer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#9E7835" />
      <stop offset="50%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#C59D54" />
    </linearGradient>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="120" height="120" rx="24" fill="#09090B" />
  <rect width="118" height="118" x="1" y="1" rx="23" fill="none" stroke="url(#favGoldPrimary)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Orbit Ring 1 -->
  <ellipse cx="60" cy="60" rx="46" ry="17" transform="rotate(-28 60 60)" fill="none" stroke="url(#favGoldPrimary)" stroke-width="2.5" />

  <!-- Outer Orbit Ring 2 -->
  <ellipse cx="60" cy="60" rx="44" ry="15" transform="rotate(35 60 60)" fill="none" stroke="url(#favGoldShimmer)" stroke-width="1.75" />

  <!-- Orbit Satellites -->
  <circle cx="20" cy="42" r="3" fill="#FFFFFF" />
  <circle cx="100" cy="78" r="3" fill="url(#favGoldShimmer)" />

  <!-- Central Interlocking Monogram: F & G -->
  <g transform="translate(60, 60)">
    <!-- G Curve -->
    <path d="M 12 -18 C 4 -26, -14 -26, -22 -14 C -30 -2, -30 14, -20 22 C -10 30, 10 30, 20 18 C 24 14, 25 8, 25 2 L 0 2" fill="none" stroke="url(#favGoldPrimary)" stroke-width="4.5" stroke-linecap="square" />
    <!-- F Stem -->
    <path d="M -6 -23 L -6 23" stroke="url(#favGoldShimmer)" stroke-width="4.5" stroke-linecap="square" />
    <!-- F Top -->
    <path d="M -6 -21 L 18 -21" stroke="url(#favGoldShimmer)" stroke-width="4" stroke-linecap="square" />
    <!-- F Mid -->
    <path d="M -6 -5 L 12 -5" stroke="url(#favGoldPrimary)" stroke-width="3.5" stroke-linecap="square" />
    <!-- Starburst -->
    <path d="M 0,-14 Q 0,0 -14,0 Q 0,0 0,14 Q 0,0 14,0 Q 0,0 0,-14 Z" fill="#FFFFFF" transform="translate(18, -12) scale(0.7)" />
  </g>
</svg>